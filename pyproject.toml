[project]
name = "forti-prep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bottleneck>=1.6.0",
    "cf-units>=3.3.1",
    "click>=8.4.1",
    "netcdf4>=1.7.4",
    "pyproj>=3.0.0",
    "pydantic>=2.13.4",
    "xarray>=2026.4.0",
]

[project.scripts]
forti-prep = "forti_prep.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forti_prep"]
